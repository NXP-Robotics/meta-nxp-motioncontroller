# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "motioncontroller-middleware"
BBFILE_PATTERN_motioncontroller-middleware := "^${LAYERDIR}"
BBFILE_PRIORITY_motioncontroller-middleware = "9"
LAYERSERIES_COMPAT_motioncontroller-middleware = "scarthgap"

