# We have a conf and classes directory, add to BBPATH
# Note how we PREpend BBPATH. This is due to the fact that
# bitbake does not override classes per layer as it does
# recipes. Classes are processed strictly in BBPATH order.
# As we unfortunately have to override standard classes for
# bug fixing, we prepend instead of append our path.
BBPATH =. "${LAYERDIR}:"

BBFILE_COLLECTIONS += "noble-jazzy"
BBFILE_PATTERN_noble-jazzy := "^${LAYERDIR}"
BBFILE_PRIORITY_noble-jazzy = "9"

# The dynamic-layers directory hosts the extensions and layer specific
# modifications related to NXP products.
#
# The .bbappend and .bb files are included if the respective layer
# collection is available.

BBFILES_DYNAMIC += "\
        ${@' '.join('%s:${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bbappend' % (layer, layer) \
        for layer in BBFILE_COLLECTIONS.split())} \
"

BBFILES_DYNAMIC += "\
        ${@' '.join('%s:${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bb' % (layer, layer) \
        for layer in BBFILE_COLLECTIONS.split())} \
"

BBFILES_DYNAMIC += "\
        linaro-toolchain:${LAYERDIR}/dynamic-layers/linaro-toolchain/*/*.bbappend \
"

# We want our meta-alb recipes to be applied *after* the
# dynamic layer changes. This is for us to use the dynamic-layers to
# override existing layers before we apply our changes
BBFILES += " \
        ${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend \
        ${LAYERDIR}/classes/*.bb* \
"

BBMASK += "meta-alb/meta-alb-sdk/classes/nativeaptinstall.bbclass"
BBMASK += "meta-alb/meta-alb-sdk/classes/qemu.bbclass"
BBMASK += "meta-alb/meta-alb-sdk/conf/machine/s32n79rdbubuntu.conf"
BBMASK += "meta-alb/meta-alb-sdk/conf/machine/include/ubuntubasics.inc"
BBMASK += "meta-alb/meta-alb-sdk/dynamic-layers/core/recipes-devtools/pseudo"
BBMASK += "meta-alb/meta-alb-sdk/dynamic-layers/core/recipes-devtools/qemu"
BBMASK += "meta-alb/meta-alb-sdk/recipes-extended/ubuntu"
BBMASK += "meta-alb/meta-alb-sdk/recipes-fsl/images/fsl-image-ubuntu-base.bb"
BBMASK += "meta-alb/meta-alb-sdk/recipes-fsl/images/fsl-image-ubuntu.bb"

LAYERSERIES_COMPAT_noble-jazzy = "scarthgap"

RELEASE_BASE ?= "release/s32n7_bsp3.0"
