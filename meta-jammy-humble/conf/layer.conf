# We have a conf and classes directory, add to BBPATH
# Note how we PREpend BBPATH. This is due to the fact that
# bitbake does not override classes per layer as it does
# recipes. Classes are processed strictly in BBPATH order.
# As we unfortunately have to override standard classes for
# bug fixing, we prepend instead of append our path.

#This layer is a stripped down version of the AMP meta-alb layer
#meant to be used independently outside the AMP solution.
BBPATH =. "${LAYERDIR}:"

BBFILE_COLLECTIONS += "jammy-humble"
BBFILE_PATTERN_jammy-humble := "^${LAYERDIR}"
BBFILE_PRIORITY_jammy-humble = "9"

BBFILES_DYNAMIC += "\
        ${@' '.join('%s:${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bbappend' % (layer, layer) \
        for layer in BBFILE_COLLECTIONS.split())} \
"

BBFILES_DYNAMIC += "\
        ${@' '.join('%s:${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bb' % (layer, layer) \
        for layer in BBFILE_COLLECTIONS.split())} \
"

BBFILES += " \
        ${LAYERDIR}/images/*.bb* \
        ${LAYERDIR}/packagegroups/*.bb* \
        ${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend \
        ${LAYERDIR}/classes/*.bb* \
"

BBMASK += "meta-alb/meta-alb-sdk/classes"
BBMASK += "meta-alb/meta-alb-sdk/conf/machine/include"
BBMASK += "meta-alb/meta-alb-sdk/dynamic-layers/core/recipes-devtools/pseudo"
BBMASK += "meta-alb/meta-alb-sdk/dynamic-layers/core/recipes-devtools/qemu"
BBMASK += "meta-alb/meta-alb-sdk/recipes-devtools/gcc"
BBMASK += "meta-alb/meta-alb-sdk/recipes-extended/ubuntu"
BBMASK += "meta-alb/meta-alb-sdk/recipes-fsl/images"
BBMASK += "poky/meta/recipes-devtools/binutils"
BBMASK += "poky/meta/recipes-devtools/gcc"
BBMASK += "poky/meta/recipes-devtools/pseudo"
BBMASK += "poky/meta/recipes-devtools/qemu"

PREFERRED_PROVIDER_qemu = "qemu"
PREFERRED_VERSION_qemu-native = "4.2.1"
PREFERRED_VERSION_qemu = "4.2.1"
PREFERRED_VERSION_nativesdk-qemu = "4.2.1"

LAYERSERIES_COMPAT_jammy-humble = "scarthgap"
RELEASE_BASE ?= "release/s32n7_bsp3.0"

DEBUG_PREFIX_MAP:remove = "-fcanon-prefix-map"